name: "[AI] Engineering Capability Coverage"

on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/neqsim/mcp/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - 'devtools/*engineering*coverage*'
      - 'devtools/engineering_capabilities.json'
      - '.github/workflows/ai-engineering-capability-coverage.yml'
  push:
    branches: [master]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/neqsim/mcp/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - 'devtools/*engineering*coverage*'
      - 'devtools/engineering_capabilities.json'
      - '.github/workflows/ai-engineering-capability-coverage.yml'

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock
      - run: uv sync --project devtools --locked --group test
      - run: uv run --project devtools --locked --group test python -m pytest devtools/test_engineering_coverage.py -q
      - run: uv run --project devtools --locked devtools/build_engineering_coverage.py --check
