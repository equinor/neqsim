name: "[AI] MCP Protocol Qualification"

permissions:
  contents: read

concurrency:
  group: mcp-protocol-qualification-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - master
    paths:
      - 'pom*.xml'
      - 'src/main/java/neqsim/mcp/**'
      - 'src/test/java/neqsim/mcp/**'
      - 'neqsim-mcp-server/**'
      - '.github/workflows/ai-mcp-protocol-qualification.yml'
  push:
    branches:
      - master
    paths:
      - 'pom*.xml'
      - 'src/main/java/neqsim/mcp/**'
      - 'src/test/java/neqsim/mcp/**'
      - 'neqsim-mcp-server/**'
      - '.github/workflows/ai-mcp-protocol-qualification.yml'

jobs:
  phase0_contracts:
    name: Qualify MCP contracts over packaged MCP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 environment
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Phase 0 documentation accounting
        run: python neqsim-mcp-server/tests/documentation/test_phase0_documentation.py

      - name: Install exact core and run focused Java contracts
        run: |
          mvn -B install \
            -Dtest=neqsim.mcp.runners.ModelRegistryTest,neqsim.mcp.runners.SessionRunnerTest,neqsim.mcp.runners.SessionRunnerContractTest,neqsim.mcp.runners.StatePersistenceRunnerTest,neqsim.mcp.runners.AutomationLoopRunnerTest,neqsim.mcp.runners.AutomationVariableWriteContractTest,neqsim.mcp.runners.McpRunnerContractTest,neqsim.mcp.runners.VisualizationRunnerTest,neqsim.mcp.runners.PluginRegistryContractTest,neqsim.mcp.runners.GeneralCapabilityRunnerTest,neqsim.mcp.runners.TaskSolverRunnerTest,neqsim.mcp.runners.StreamingRunnerTest,neqsim.mcp.runners.McpPrincipalScopingTest,neqsim.mcp.runners.CompositionRunnerTest,neqsim.mcp.runners.RiskMatrixRunnerTest,neqsim.mcp.runners.LOPARunnerTest,neqsim.mcp.runners.ValidatorTest,neqsim.mcp.runners.EngineeringValidatorTest,neqsim.mcp.runners.ProcessComparisonRunnerTest,neqsim.mcp.runners.OperationalStudyRunnerTest,neqsim.mcp.runners.HazopScenarioRunnerTest,neqsim.mcp.runners.SafetySystemPerformanceRunnerTest,neqsim.mcp.runners.OpenDrainReviewRunnerTest,neqsim.mcp.runners.NorsokS001Clause10ReviewRunnerTest,neqsim.process.safety.processsafetysystem.ProcessSafetySystemReviewEngineTest,neqsim.mcp.runners.ReportRunnerTest,neqsim.mcp.runners.SecurityRunnerTest,neqsim.mcp.runners.McpSecurityEnforcementTest \
            -Djacoco.skip=true -Dmaven.javadoc.skip=true -ntp

      - name: Build exact MCP server package
        shell: bash
        run: |
          NEQSIM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          cd neqsim-mcp-server
          mvn -B package -Dneqsim.version="$NEQSIM_VERSION" -DskipTests -Dmaven.javadoc.skip=true -ntp

      - name: Run focused real-MCP API-inspection qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_inspect_api_protocol.py

      - name: Run focused real-MCP validation-profile qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_validation_profile_protocol.py

      - name: Run focused real-MCP automation-read qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_automation_read_protocol.py

      - name: Run focused real-MCP model-registry qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_model_registry_protocol.py

      - name: Run focused real-MCP session-lifecycle qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_session_protocol.py

      - name: Run focused real-MCP persisted-state qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_state_persistence_protocol.py

      - name: Run focused real-MCP adjustable-parameter qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_adjustable_parameters_protocol.py

      - name: Run focused real-MCP process-loop qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_process_loop_protocol.py

      - name: Run focused real-MCP utility-design qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_utility_design_protocol.py

      - name: Run focused real-MCP chemistry qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_chemistry_protocol.py

      - name: Run focused real-MCP flare-radiation qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_flare_radiation_protocol.py

      - name: Run focused real-MCP HAZOP-scenario qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_hazop_scenario_protocol.py

      - name: Run focused real-MCP safety-system-performance qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_safety_system_performance_protocol.py

      - name: Run focused real-MCP open-drain-review qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_open_drain_review_protocol.py

      - name: Run focused real-MCP NORSOK S-001 Clause 10 review qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_norsok_s001_clause10_review_protocol.py

      - name: Run focused real-MCP simulation-variable mutation qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_simulation_variable_write_protocol.py

      - name: Run focused real-MCP simulation-state snapshot qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_simulation_state_snapshot_protocol.py

      - name: Run focused real-MCP visualization qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_visualization_protocol.py

      - name: Run focused real-MCP process-local plugin qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_plugin_protocol.py

      - name: Run focused real-MCP runtime-capability qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_capability_protocol.py

      - name: Run focused real-MCP composed-workflow qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_compose_workflow_protocol.py

      - name: Run focused real-MCP task-solver qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_solve_task_protocol.py

      - name: Run focused real-MCP bounded-streaming qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_streaming_protocol.py

      - name: Run focused real-MCP multi-server composition qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_composition_protocol.py

      - name: Run focused real-MCP bounded risk-matrix qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_risk_matrix_protocol.py

      - name: Run focused real-MCP bounded LOPA qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_lopa_protocol.py

      - name: Run focused real-MCP bounded SIL qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_sil_protocol.py

      - name: Run focused real-MCP process-comparison qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_process_comparison_protocol.py

      - name: Run focused real-MCP barrier-register qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_barrier_register_protocol.py

      - name: Run focused real-MCP operational-study qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_operational_study_protocol.py

      - name: Run focused real-MCP pre-flight validation qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_validate_input_protocol.py

      - name: Run focused real-MCP result-validation qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_validate_results_protocol.py

      - name: Run focused real-MCP reporting qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_reporting_protocol.py

      - name: Run focused real-MCP security-management qualification
        run: cd neqsim-mcp-server && python tests/protocol/test_security_protocol.py

      - name: Run comprehensive real-MCP protocol regression
        run: cd neqsim-mcp-server && python tests/protocol/test_mcp_server.py
