name: "[AI] Production Restart Qualification"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/production-decision/**'
      - 'src/main/java/neqsim/process/equipment/pipeline/TwoFluidPipe.java'
      - 'src/main/java/neqsim/process/equipment/pipeline/twophasepipe/**'
      - 'src/test/java/neqsim/process/equipment/pipeline/twophasepipe/TwoFluidUnsplitTengesdalPreparationTest.java'
      - '.github/workflows/ai-production-restart-qualification.yml'

permissions:
  contents: read

concurrency:
  group: production-restart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock
      - name: Compile the PR physics and resolve its runtime classpath
        id: compile
        run: ./mvnw -B -ntp -DskipTests compile dependency:build-classpath -Dmdep.outputFile=target/restart-classpath.txt
      - name: Qualify the tracked-force five-second mesh and time-step matrix
        run: >-
          ./mvnw -B -ntp
          -Dtest=TwoFluidUnsplitTengesdalPreparationTest#fiveSecondTrackedSubcellForceRiserQualificationMustCompleteTheWholeInterval
          -Dgroups=slow
          -DexcludedTestGroups=
          -Dneqsim.unsplit.tengesdal.tracked-force-qualification=true
          test
      - name: Qualify tracked-force 180 second mesh and time-step matrix
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: >-
          ./mvnw -B -ntp
          -Dtest=TwoFluidUnsplitTengesdalPreparationTest#trackedSubcellForceLongIntervalMustCompleteConservatively
          -Dgroups=slow
          -DexcludedTestGroups=
          -Dneqsim.unsplit.tengesdal.tracked-force-long-qualification=true
          test
      - name: Qualify tracked-force 600 second mesh and time-step matrix
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: >-
          ./mvnw -B -ntp
          -Dtest=TwoFluidUnsplitTengesdalPreparationTest#trackedSubcellForceSustainedIntervalMustCompleteConservatively
          -Dgroups=slow
          -DexcludedTestGroups=
          -Dneqsim.unsplit.tengesdal.tracked-force-sustained-qualification=true
          test
      - name: Exercise the installed restart, instrument holdouts and blind decisions
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          export NEQSIM_CLASSPATH="$PWD/target/classes:$(cat target/restart-classpath.txt)"
          uv run --project devtools --locked python -m unittest discover -s examples/production-decision -v
