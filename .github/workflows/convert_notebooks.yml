name: Convert Notebooks to Markdown

on:
  push:
    branches: [master]
    paths:
      - 'docs/examples/*.ipynb'
      - 'docs/convert_notebooks.py'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  convert-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Convert notebooks to Markdown
        run: |
          cd docs
          python convert_notebooks.py

      - name: Normalize notebook links for GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import quote

          base = "https://github.com/equinor/neqsim/blob/master/docs/examples/"
          pattern = re.compile(
              r"(\[[^\]]+\])\((?!https?://)([^()/]+\.ipynb)(#[^)]*)?\)"
          )

          for markdown_path in Path("docs/examples").glob("*.md"):
              content = markdown_path.read_text(encoding="utf-8")

              def replace_notebook_link(match):
                  label, notebook, fragment = match.groups()
                  return (
                      f"{label}({base}{quote(notebook, safe='')}"
                      f"{fragment or ''})"
                  )

              normalized = pattern.sub(replace_notebook_link, content)
              if normalized != content:
                  markdown_path.write_text(normalized, encoding="utf-8")
          PY

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code docs/examples/*.md || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-convert notebooks to Markdown for GitHub Pages"
          title: "docs: Auto-convert notebooks to Markdown"
          body: |
            This PR was automatically generated to convert Jupyter notebooks to Markdown for GitHub Pages.

            Changes include updated markdown versions of notebooks in `docs/examples/`.
          branch: auto-convert-notebooks
          delete-branch: true
          labels: documentation, automated
