name: Copilot plugin

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/workflows/copilot_plugin.yml'
      - 'devtools/build_copilot_plugin.py'
      - 'devtools/test_build_copilot_plugin.py'
      - 'devtools/smoke_copilot_plugin.py'
      - 'devtools/verify_skills_agents.py'
      - 'docs/integration/copilot_plugin.md'
  push:
    branches: [master]
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/workflows/copilot_plugin.yml'
      - 'devtools/*copilot_plugin.py'
      - 'devtools/verify_skills_agents.py'
      - 'docs/integration/copilot_plugin.md'

jobs:
  package:
    name: Package Copilot plugin (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test packaging and STDIO harness
        run: python -m unittest discover -s devtools -p test_build_copilot_plugin.py -v
      - name: Test packaging with a non-UTF-8 default encoding
        if: runner.os == 'Linux'
        env:
          LC_ALL: C
          PYTHONCOERCECLOCALE: '0'
          PYTHONUTF8: '0'
        run: python -m unittest discover -s devtools -p test_build_copilot_plugin.py -v
      - name: Assemble plugin
        run: python devtools/build_copilot_plugin.py --archive target/neqsim-copilot-plugin.zip
      - uses: actions/upload-artifact@v7
        with:
          name: neqsim-copilot-plugin-${{ runner.os }}
          path: target/neqsim-copilot-plugin.zip
          if-no-files-found: error
