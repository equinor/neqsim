name: "[Core] Build, Test, and Javadoc"
permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  changes:
    name: Detect Java source changes, Maven POM changes or numerical-data changes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run_tests:
              - '**/*.java'
              - '**/pom*.xml'
              - 'src/main/resources/data/**'
              - 'src/test/resources/**'
              - '.github/workflows/core-run-build-test-and-javadoc.yml'
              - 'devtools/collect_electrolyte_evidence.py'
              - 'devtools/test_collect_electrolyte_evidence.py'

  test_javadoc:
    name: Assert javadoc with Java 21 on Ubuntu
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up Java 21 environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate javadoc
        run: mvn javadoc:javadoc -ntp

  test_java_matrix:
    name: Assert tests with Java 21 on ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    needs: test_javadoc
    # The full fast suite with JaCoCo reached the former 90-minute limit on Ubuntu
    # in PR #4421 while still completing tests without failures. Allow headroom
    # for coverage instrumentation and hosted-runner variation.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            os: ubuntu-latest
            verify_jacoco: true
          - platform: Windows
            os: windows-latest
            verify_jacoco: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up Java 21 environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run fast tests and generate JaCoCo report
        if: matrix.verify_jacoco
        run: mvn -B test -ntp -DskipITs
      - name: Run fast tests, do not generate JaCoCo report
        if: ${{ !matrix.verify_jacoco }}
        # PR #4484: Temurin 21.0.12.1 on Windows crashed with an access violation
        # in the C2-compiled EJML LU solve during PTPhaseEnvelopeReferenceEosTest.
        # PR #4499: the retained crash log also identifies C2-compiled
        # PhaseSrkCPA.initCPAMatrix in an access violation during SystemHybridEosGeFlashTest.
        # Interpret only these methods; retain the solvers, assertions and full suite.
        # JAVA_TOOL_OPTIONS also reaches the forked Surefire JVM.
        env:
          JAVA_TOOL_OPTIONS: >-
            -XX:CompileCommand=exclude,org.ejml.dense.row.linsol.lu.LinearSolverLu_DDRM::solve
            -XX:CompileCommand=exclude,neqsim.thermo.phase.PhaseSrkCPA::initCPAMatrix
        run: mvn -B test -ntp -DskipITs "-Djacoco.skip=true"
      - name: Retain fast-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-test-reports-${{ matrix.platform }}
          path: target/surefire-reports/
          if-no-files-found: warn
      - name: Retain JVM crash logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-crash-logs-${{ matrix.platform }}
          path: |
            hs_err_pid*.log
            replay_pid*.log
          if-no-files-found: ignore
      - name: Verify JaCoCo report exists
        if: matrix.verify_jacoco && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            echo "JaCoCo report found"
            head -20 target/site/jacoco/jacoco.xml
          else
            echo "ERROR: JaCoCo report not found!"
            echo "Checking for jacoco.exec..."
            ls -la target/ | grep -i jacoco || echo "No jacoco files in target/"
            echo "Checking target/site/jacoco/..."
            ls -la target/site/jacoco/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
      - name: Upload jacoco coverage reports to Codecov
        if: matrix.verify_jacoco && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v7
        with:
          files: target/site/jacoco/jacoco.xml
          name: codecov
          use_oidc: true
          fail_ci_if_error: true

  model_spec:
    name: Assert model specifications (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.run_tests == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '8'
            pom: pomJava8.xml
          - java: '21'
            pom: pom.xml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run numerical and absence contracts
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            # -U also rechecks missing releases cached by a failed download.
            if mvn -B -U test -ntp -f ${{ matrix.pom }} -DskipITs -Djacoco.skip=true \
              "-Dtest=ModelSpec*Test,ComponentCorrelationSpecTest" \
              -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true \
              2>&1 | tee "$RUNNER_TEMP/model-spec-maven-$attempt.log"; then
              exit 0
            else
              status=$?
            fi
            # Surefire wraps provider-download failures in MojoExecutionException.
            # Include nested provider-POM descriptor errors (for example a Central HTTP 403).
            # Match resolution diagnostics, never generic execution or test failures.
            if [ "$attempt" -eq 2 ] || ! grep -Eq \
              -e '^\[ERROR\] \[Help [0-9]+\] https?://[^ ]+/(PluginResolutionException|DependencyResolutionException)$' \
              -e '^\[ERROR\] Failed to execute goal org\.apache\.maven\.plugins:maven-surefire-plugin:[^ :]+:test .*: The following artifacts could not be resolved: org\.apache\.maven\.surefire:surefire-[[:alnum:]_-]+:jar:' \
              -e '^\[ERROR\] Failed to execute goal org\.apache\.maven\.plugins:maven-surefire-plugin:[^ :]+:test .*: Failed to collect dependencies at org\.apache\.maven\.surefire:surefire-[[:alnum:]_-]+:jar:[^ :]+: Failed to read artifact descriptor for org\.apache\.maven\.surefire:surefire-[[:alnum:]_-]+:jar:[^ :]+: The following artifacts could not be resolved: org\.apache\.maven\.surefire:surefire-[[:alnum:]_-]+:pom:' \
              "$RUNNER_TEMP/model-spec-maven-$attempt.log"; then
              exit "$status"
            fi
            echo "Maven dependency resolution failed; retrying once in 10 seconds."
            sleep 10
          done
      - name: Retain per-case evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-spec-java-${{ matrix.java }}
          path: |
            target/model-spec/
            target/surefire-reports/
          if-no-files-found: error

      - name: Publish model coverage summary
        if: always()
        run: |
          if [ -f target/model-spec/coverage.md ]; then
            cat target/model-spec/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Model inventory report missing; inspect the failed spec gate.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  agent_benchmark:
    name: Assert agentic benchmark accuracy
    runs-on: ubuntu-latest
    needs: test_javadoc
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - name: Set up Java 21 environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run AgentBenchmarkRunner accuracy gate
        run: mvn -B test -ntp "-Dtest=AgentBenchmark*Test" "-DfailIfNoTests=false" "-Djacoco.skip=true"
      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo "### Agentic benchmark"
            echo '```'
            cat target/agent_benchmark_summary.txt 2>/dev/null || echo "no benchmark summary produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test_java_slow:
    name: Assert slow tests (${{ matrix.label }}) with Java 21 on Ubuntu
    runs-on: ubuntu-latest
    needs: test_javadoc
    # Four equal-count shards left one at the 60-minute limit while others
    # finished in 14-30 minutes. Split each former shard in two without dropping tests.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: 1/8
          - shard: 1
            label: 2/8
          - shard: 2
            label: 3/8
          - shard: 3
            label: 4/8
          - shard: 4
            label: 5/8
          - shard: 5
            label: 6/8
          - shard: 6
            label: 7/8
          - shard: 7
            label: 8/8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up Java 21 environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run slow-test shard without JaCoCo
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          mapfile -t slow_files < <(
            grep -rl --include='*.java' '@Tag("slow")' src/test/java | sort
          )
          selected=()
          for index in "${!slow_files[@]}"; do
            if ((index % SHARD_COUNT == SHARD_INDEX)); then
              class_name="${slow_files[$index]#src/test/java/}"
              class_name="${class_name%.java}"
              selected+=("${class_name//\//.}")
            fi
          done
          if ((${#selected[@]} == 0)); then
            echo "No slow tests discovered for shard $SHARD_INDEX"
            exit 1
          fi
          printf 'Slow-test shard %s/%s: %s classes\n' "$((SHARD_INDEX + 1))" "$SHARD_COUNT" "${#selected[@]}"
          printf '  %s\n' "${selected[@]}"
          printf '%s\n' "${selected[@]}" > "$RUNNER_TEMP/slow-selected-tests.txt"
          test_pattern=$(IFS=,; echo "${selected[*]}")
          set -o pipefail
          for attempt in 1 2; do
            # -U also rechecks missing releases cached by a failed download.
            if mvn -B -U test -ntp -Dtest="$test_pattern" -Dgroups=slow \
              "-DexcludedTestGroups=" "-Djacoco.skip=true" \
              2>&1 | tee "$RUNNER_TEMP/slow-test-maven-$SHARD_INDEX-$attempt.log"; then
              exit 0
            else
              status=$?
            fi
            # Surefire wraps provider-download failures in MojoExecutionException.
            # Include nested provider-POM descriptor errors (for example a Central HTTP 403).
            # Match resolution diagnostics, never generic execution or test failures.
            if [ "$attempt" -eq 2 ] || ! grep -Eq \
              -e '^\[ERROR\] \[Help [0-9]+\] https?://[^ ]+/(PluginResolutionException|DependencyResolutionException)$' \
              -e '^\[ERROR\] Failed to execute goal org\.apache\.maven\.plugins:maven-surefire-plugin:[^ :]+:test .*: The following artifacts could not be resolved: org\.apache\.maven\.surefire:surefire-[[:alnum:]_-]+:jar:' \
              -e '^\[ERROR\] Failed to execute goal org\.apache\.maven\.plugins:maven-surefire-plugin:[^ :]+:test .*: Failed to collect dependencies at org\.apache\.maven\.surefire:surefire-[[:alnum:]_-]+:jar:[^ :]+: Failed to read artifact descriptor for org\.apache\.maven\.surefire:surefire-[[:alnum:]_-]+:jar:[^ :]+: The following artifacts could not be resolved: org\.apache\.maven\.surefire:surefire-[[:alnum:]_-]+:pom:' \
              "$RUNNER_TEMP/slow-test-maven-$SHARD_INDEX-$attempt.log"; then
              exit "$status"
            fi
            echo "Maven dependency resolution failed; retrying once in 10 seconds."
            sleep 10
          done
      - name: Retain slow-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-test-reports-${{ matrix.shard }}
          path: target/surefire-reports/
          if-no-files-found: warn
      - name: Collect electrolyte assessment evidence
        if: always()
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          NEQSIM_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 devtools/collect_electrolyte_evidence.py
          --selected-tests "$RUNNER_TEMP/slow-selected-tests.txt"
          --shard "$SHARD_INDEX"
      - name: Retain electrolyte assessment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electrolyte-assessment-evidence-${{ matrix.shard }}
          path: target/electrolyte-evidence/
          if-no-files-found: error

  test_java_slow_required:
    name: Assert all slow tests with Java 21 on Ubuntu
    runs-on: ubuntu-latest
    needs: [changes, test_java_slow]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_tests == 'true')
    steps:
      - name: Require every slow-test shard to pass
        env:
          SLOW_TEST_RESULT: ${{ needs.test_java_slow.result }}
        run: test "$SLOW_TEST_RESULT" = success

  test_java_8:
    name: Assert tests with Java 8 on Ubuntu
    runs-on: ubuntu-latest
    needs: test_java_matrix
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Run tests
        run: mvn -B test --file pomJava8.xml -ntp "-Djacoco.skip=true"

  test_java_8_windows:
    name: Assert tests with Java 8 on Windows
    runs-on: windows-latest
    needs: test_java_matrix
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Run tests
        run: mvn -B test --file pomJava8.xml -ntp "-Djacoco.skip=true"

  verify_agent_skills:
    name: Verify agent-skill cross-references
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock
      - name: Sync devtools environment
        run: uv sync --project devtools --locked
      - name: Check agent-skill references
        run: uv run --project devtools --locked devtools/verify_agent_skill_refs.py
