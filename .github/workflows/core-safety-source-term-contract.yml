name: "[Core] Safety Source-Term Contract"

on:
  pull_request:
    paths:
      - "src/main/java/neqsim/process/safety/release/**"
      - "src/main/java/neqsim/process/dynamics/**"
      - "src/main/java/neqsim/process/processmodel/**"
      - "src/main/java/neqsim/process/equipment/stream/**"
      - "src/main/java/neqsim/process/equipment/separator/**"
      - "src/main/resources/neqsim/process/safety/release/**"
      - "src/test/java/neqsim/process/safety/release/**"
      - "src/test/java/neqsim/process/dynamics/DynamicCapabilityBuiltInInventoryTest.java"
      - "docs/process/safety/**"
      - "devtools/validate_source_term_contract.py"
      - ".github/workflows/core-safety-source-term-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-source-terms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock
      - name: Sync devtools test environment
        run: uv sync --project devtools --locked --group test
      - name: Check formatting and process/source regressions
        run: |
          ./mvnw -B -ntp spotless:check
          ./mvnw -B -ntp -Dtest=DynamicCapabilityBuiltInInventoryTest,ReleaseFlowModelTest,ReleaseFlowFlashingTest,ReleaseFlowAdapterTest,IdealGasFannoPipeReleaseModelTest,DriftFluxHomogeneousEquilibriumReleaseModelTest,FiniteRateDriftFluxReleaseModelTest,ComponentSelectiveFiniteRateReleaseModelTest,RanzMarshallFiniteRateReleaseModelTest,PredictiveBubbleTransferZoneReleaseModelTest,ReleaseInventoryTest,ReleaseInventoryVuRefinementTest,ReleaseInventoryCpaIsolationTest,LeakModelTest,SourceTermFrameTest,SourceTermSessionTest,ReleaseFlowEnsembleTest,ReleaseFlowBenchmarkTest test
      - name: Validate emitted frames and schema rejection cases
        run: |
          uv run --project devtools --locked --group test devtools/validate_source_term_contract.py
      - name: Check documentation discovery
        run: uv run --project devtools --locked devtools/check_documentation_search.py
      - name: Retain test reports and emitted contract fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safety-source-term-validation
          path: |
            target/surefire-reports/
            target/source-term-contract-fixtures/
            target/source-term-benchmarks/
          retention-days: 14
