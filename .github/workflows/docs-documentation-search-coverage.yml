name: "[Docs] Documentation Search Coverage"

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "devtools/check_documentation_search.py"
      - "devtools/generate_equipment_documentation_catalog.py"
      - "src/main/java/neqsim/process/equipment/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/docs-documentation-search-coverage.yml"

concurrency:
  group: documentation-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Build and verify complete search index
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: devtools/uv.lock
      - name: Sync devtools test environment
        run: uv sync --project devtools --locked --group test
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Check search source contracts
        run: uv run --project devtools --locked devtools/check_documentation_search.py
      - name: Run documentation contract tests
        run: uv run --project devtools --locked --group test python -m unittest discover -s docs -p "test_*.py" -v
      - name: Build documentation
        run: bundle exec jekyll build --source docs --destination _site
      - name: Verify generated search coverage
        run: uv run --project devtools --locked devtools/check_documentation_search.py --site _site
      - name: Check search JavaScript syntax
        run: node --check docs/assets/js/search.js
