name: Execute Energy Network Notebooks

on:
  pull_request:
    branches: [master]
    paths:
      - 'examples/notebooks/energy_networks/**'
      - '.github/workflows/energy-notebook-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out integrated branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build workspace classes
        run: ./mvnw -q -DskipTests package

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install notebook runtime
        run: python -m pip install --upgrade pip nbformat nbconvert jupyter pandas matplotlib numpy jpype1

      - name: Normalize notebook sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          for path in sorted(Path('examples/notebooks/energy_networks').glob('*.ipynb')):
              notebook = nbformat.read(path, as_version=4)
              first_code = True
              for cell in notebook.cells:
                  if cell.cell_type == 'code' and first_code:
                      inline = 'get_ipython().run_line_magic("matplotlib", "inline")'
                      if inline not in cell.source:
                          cell.source = inline + '\n' + cell.source
                      first_code = False

              if path.name.startswith('01_'):
                  notebook.cells[0].source = notebook.cells[0].source.replace(
                      '**Implementation dependencies:** Energy Networks v3 and PR #2613 for optional minimum-cost/minimum-emissions strategies.',
                      '**Implementation dependencies:** merged Energy Networks v3 baseline PR #2603 and dispatch PR #2613.'
                  )

              if path.name.startswith('04_'):
                  for cell in notebook.cells:
                      if cell.cell_type != 'code':
                          continue
                      if 'result = OffshoreEnergyReferenceCase.run24HourCase()' in cell.source:
                          cell.source = '''result = OffshoreEnergyReferenceCase.run24HourCase()
          OffshoreEnergyReferenceCase.requireAcceptanceCriteria(result)
          print(result.toJson())'''
                      elif 'interval_rows = []' in cell.source:
                          cell.source = '''import pandas as pd
          interval_rows = []
          for interval in result.getIntervals():
              report = interval.getNetworkReports().get(0)
              allocations = {str(a.getParticipantName()): a for a in report.getAllocations()}
              interval_rows.append({
                  "start_h": interval.getStartTimeSeconds()/3600.0,
                  "duration_h": interval.getDurationSeconds()/3600.0,
                  "served_MW": report.getServedDemand()/1e6,
                  "unmet_MW": report.getUnmetDemand()/1e6,
                  "total_curtailed_MW": report.getCurtailedSupply()/1e6,
                  "wind_MW": allocations["offshore wind.power"].getAllocatedPower()/1e6,
                  "gas_MW": allocations["gas turbine generation.power"].getAllocatedPower()/1e6,
                  "critical_MW": allocations["critical process load.power"].getAllocatedPower()/1e6,
                  "flexible_MW": allocations["flexible process load.power"].getAllocatedPower()/1e6,
                  "cost_per_h": report.getOperatingCostPerHour(),
                  "co2_kg_per_h": report.getCo2EmissionRate(),
              })
          interval_df = pd.DataFrame(interval_rows)
          interval_df'''
                      elif 'served_MW", "unmet_MW"' in cell.source:
                          cell.source = '''import matplotlib.pyplot as plt
          ax = interval_df.plot(x="start_h", y=["served_MW", "unmet_MW", "total_curtailed_MW"],
                                drawstyle="steps-post", marker="o", figsize=(9,4))
          ax.set_xlabel("Time (h)")
          ax.set_ylabel("Power (MW)")
          ax.set_title("Offshore benchmark energy balance")
          ax.grid()
          plt.tight_layout()
          plt.show()'''
                      elif 'kpis = pd.Series' in cell.source:
                          cell.source = '''kpis = pd.Series({
              "served energy (MWh)": result.getServedEnergyMWh(),
              "unmet energy (MWh)": result.getUnmetEnergyMWh(),
              "total curtailed supply (MWh)": result.getCurtailedEnergyMWh(),
              "curtailed wind (MWh)": OffshoreEnergyReferenceCase.getWindCurtailedEnergyMWh(result),
              "accepted wind (MWh)": OffshoreEnergyReferenceCase.getWindGeneratedEnergyMWh(result),
              "accepted gas (MWh)": OffshoreEnergyReferenceCase.getGasGeneratedEnergyMWh(result),
              "operating cost": result.getOperatingCost(),
              "CO2-equivalent (kg)": result.getCo2EmissionsKg(),
          })
          kpis'''

              nbformat.write(notebook, path)
              print(f'Normalized {path}')
          PY

      - name: Execute notebooks through devtools workspace classes
        env:
          NEQSIM_PROJECT_ROOT: ${{ github.workspace }}
          MPLBACKEND: Agg
        shell: bash
        run: |
          set -u
          mkdir -p notebook-execution-logs
          failed=0
          for notebook in examples/notebooks/energy_networks/*.ipynb; do
            name="$(basename "$notebook" .ipynb)"
            if python -m jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=1200 \
              --ExecutePreprocessor.kernel_name=python3 \
              "$notebook" >"notebook-execution-logs/${name}.log" 2>&1; then
              echo "PASS $notebook" | tee -a notebook-execution-logs/summary.txt
            else
              echo "FAIL $notebook" | tee -a notebook-execution-logs/summary.txt
              failed=1
            fi
          done
          echo "$failed" > notebook-execution-logs/failed-count.txt

      - name: Upload notebook diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-network-notebook-diagnostics
          path: |
            examples/notebooks/energy_networks/*.ipynb
            notebook-execution-logs/**
          if-no-files-found: error
          retention-days: 14

      - name: Validate executed notebooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebooks = sorted(Path('examples/notebooks/energy_networks').glob('*.ipynb'))
          assert len(notebooks) == 4, notebooks
          failed_count = int(Path('notebook-execution-logs/failed-count.txt').read_text().strip())
          assert failed_count == 0, Path('notebook-execution-logs/summary.txt').read_text()
          for path in notebooks:
              notebook = nbformat.read(path, as_version=4)
              code_cells = [cell for cell in notebook.cells if cell.cell_type == 'code']
              assert code_cells, path
              assert all(cell.execution_count is not None for cell in code_cells), path
              errors = [output for cell in code_cells for output in cell.get('outputs', [])
                        if output.get('output_type') == 'error']
              assert not errors, (path, errors)
              figures = [output for cell in code_cells for output in cell.get('outputs', [])
                         if 'image/png' in output.get('data', {})]
              assert len(figures) >= 3, (path, len(figures))
              print(f'{path}: {len(code_cells)} code cells, {len(figures)} figures')
          PY

      - name: Upload executed notebooks
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: executed-energy-network-notebooks
          path: examples/notebooks/energy_networks/*.ipynb
          if-no-files-found: error
          retention-days: 14
