name: Engineering capability coverage

on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/neqsim/mcp/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - 'devtools/*engineering*coverage*'
      - 'devtools/engineering_capabilities.json'
      - '.github/workflows/engineering-coverage.yml'
  push:
    branches: [master]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/neqsim/mcp/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - 'devtools/*engineering*coverage*'
      - 'devtools/engineering_capabilities.json'
      - '.github/workflows/engineering-coverage.yml'

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest devtools/test_engineering_coverage.py -q
      - run: python devtools/build_engineering_coverage.py --check
