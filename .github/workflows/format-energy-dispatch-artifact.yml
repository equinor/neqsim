name: Finalize Energy Dispatch Formatting

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/main/java/neqsim/process/equipment/stream/EnergyBus.java'
      - 'src/main/java/neqsim/process/equipment/stream/EnergyDispatchStrategy.java'
      - '.github/workflows/format-energy-dispatch-artifact.yml'

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply formatting and remove temporary workflow
        run: |
          bash devtools/run_spotless.sh apply
          rm .github/workflows/format-energy-dispatch-artifact.yml
      - name: Commit exact formatted sources
        run: |
          git config user.name "neqsim-energy-integration"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/neqsim/process/equipment/stream/EnergyBus.java \
                  src/main/java/neqsim/process/equipment/stream/EnergyDispatchStrategy.java \
                  .github/workflows/format-energy-dispatch-artifact.yml
          git commit -m "style: apply energy dispatch formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
