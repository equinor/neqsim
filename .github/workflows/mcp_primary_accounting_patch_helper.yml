name: MCP primary accounting patch helper

permissions:
  contents: write

on:
  push:
    branches:
      - ai/3153-promote-model-registry-contract

jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7

      - name: Apply bounded primary protocol accounting edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("neqsim-mcp-server/test_mcp_server.py")
          text = path.read_text(encoding="utf-8")

          old_tools = '''    contract_tools = {
              "getCapabilities", "getSchema", "getExample", "getBenchmarkTrust",
              "checkToolAccess", "manageIndustrialProfile", "searchComponents",
              "queryDataCatalog", "getProgress", "inspectApi",
              "manageValidationProfile", "listSimulationUnits", "listUnitVariables",
              "getSimulationVariable", "diagnoseAutomation",
              "getAutomationLearningReport",
          }'''
          new_tools = '''    contract_tools = {
              "getCapabilities", "getSchema", "getExample", "getBenchmarkTrust",
              "checkToolAccess", "manageIndustrialProfile", "searchComponents",
              "queryDataCatalog", "getProgress", "inspectApi",
              "manageValidationProfile", "manageModel", "listSimulationUnits",
              "listUnitVariables", "getSimulationVariable", "diagnoseAutomation",
              "getAutomationLearningReport",
          }'''
          if text.count(old_tools) != 1:
              raise SystemExit(f"expected one contract_tools block, found {text.count(old_tools)}")
          text = text.replace(old_tools, new_tools)

          old_accounting = '''    check("sixteen bounded software contracts have direct evidence",
              limitations.get("contractTestedToolCount") == 16
              and limitations.get("confirmedGapToolCount") == 35'''
          new_accounting = '''    check("seventeen bounded software contracts have direct evidence",
              limitations.get("contractTestedToolCount") == 17
              and limitations.get("confirmedGapToolCount") == 34'''
          if text.count(old_accounting) != 1:
              raise SystemExit(f"expected one primary accounting assertion, found {text.count(old_accounting)}")
          text = text.replace(old_accounting, new_accounting)

          old_gap = '''          and limitations.get("confirmedGapToolCount") == 35
              and limitations.get("unsupportedConditionCount") == 0'''
          new_gap = '''          and limitations.get("confirmedGapToolCount") == 34
              and limitations.get("unsupportedConditionCount") == 0'''
          if text.count(old_gap) != 1:
              raise SystemExit(f"expected one remaining-gap assertion, found {text.count(old_gap)}")
          text = text.replace(old_gap, new_gap)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check -- neqsim-mcp-server/test_mcp_server.py
          git diff -- neqsim-mcp-server/test_mcp_server.py > primary-accounting.patch

      - name: Create unattached exact blob for connector-owned tree update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          data = Path("neqsim-mcp-server/test_mcp_server.py").read_bytes()
          payload = json.dumps({
              "content": base64.b64encode(data).decode("ascii"),
              "encoding": "base64",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          Path("blob-sha.txt").write_text(result["sha"] + "\n", encoding="utf-8")
          print("prepared unattached blob", result["sha"])
          PY

      - name: Upload patched primary harness
        uses: actions/upload-artifact@v7
        with:
          name: mcp-primary-accounting-patched
          path: |
            neqsim-mcp-server/test_mcp_server.py
            primary-accounting.patch
            blob-sha.txt
          if-no-files-found: error
