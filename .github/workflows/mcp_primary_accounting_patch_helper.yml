name: MCP primary accounting patch helper

permissions:
  contents: write

on:
  push:
    branches:
      - ai/3153-promote-model-registry-contract

jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7

      - name: Apply bounded primary protocol accounting edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("neqsim-mcp-server/test_mcp_server.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '        "manageValidationProfile", "listSimulationUnits", "listUnitVariables",',
                  '        "manageValidationProfile", "manageModel", "listSimulationUnits",\n'
                  '        "listUnitVariables",',
                  1,
              ),
              (
                  '    check("sixteen bounded software contracts have direct evidence",',
                  '    check("seventeen bounded software contracts have direct evidence",',
                  1,
              ),
              (
                  '          limitations.get("contractTestedToolCount") == 16',
                  '          limitations.get("contractTestedToolCount") == 17',
                  1,
              ),
              (
                  '          and limitations.get("confirmedGapToolCount") == 35',
                  '          and limitations.get("confirmedGapToolCount") == 34',
                  2,
              ),
          ]
          for old, new, expected in replacements:
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"expected {expected} occurrences of {old!r}, found {found}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check -- neqsim-mcp-server/test_mcp_server.py
          git diff -- neqsim-mcp-server/test_mcp_server.py > primary-accounting.patch

      - name: Create unattached exact blob for connector-owned tree update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          data = Path("neqsim-mcp-server/test_mcp_server.py").read_bytes()
          payload = json.dumps({
              "content": base64.b64encode(data).decode("ascii"),
              "encoding": "base64",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          Path("blob-sha.txt").write_text(result["sha"] + "\n", encoding="utf-8")
          print("prepared unattached blob", result["sha"])
          PY

      - name: Upload patched primary harness
        uses: actions/upload-artifact@v7
        with:
          name: mcp-primary-accounting-patched
          path: |
            neqsim-mcp-server/test_mcp_server.py
            primary-accounting.patch
            blob-sha.txt
          if-no-files-found: error
