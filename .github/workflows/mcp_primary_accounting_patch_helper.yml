name: MCP primary accounting patch helper

permissions:
  contents: read

on:
  push:
    branches:
      - codex/3153-promote-validation-profile-contract

jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7

      - name: Apply bounded primary protocol accounting edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("neqsim-mcp-server/test_mcp_server.py")
          text = path.read_text(encoding="utf-8")

          old_tools = '        "queryDataCatalog", "getProgress", "inspectApi",\n'
          new_tools = old_tools + '        "manageValidationProfile",\n'
          if text.count(old_tools) != 1:
              raise SystemExit(f"expected one contract_tools insertion point, found {text.count(old_tools)}")
          text = text.replace(old_tools, new_tools)

          old_label = 'check("ten non-numerical contracts have bounded evidence",'
          new_label = 'check("eleven non-numerical contracts have bounded evidence",'
          if text.count(old_label) != 1:
              raise SystemExit(f"expected one accounting label, found {text.count(old_label)}")
          text = text.replace(old_label, new_label)

          old_contract_count = 'limitations.get("contractTestedToolCount") == 10'
          new_contract_count = 'limitations.get("contractTestedToolCount") == 11'
          if text.count(old_contract_count) != 1:
              raise SystemExit(f"expected one contract-tested count, found {text.count(old_contract_count)}")
          text = text.replace(old_contract_count, new_contract_count)

          old_gap_count = 'limitations.get("confirmedGapToolCount") == 41'
          new_gap_count = 'limitations.get("confirmedGapToolCount") == 40'
          if text.count(old_gap_count) != 2:
              raise SystemExit(f"expected two gap-count assertions, found {text.count(old_gap_count)}")
          text = text.replace(old_gap_count, new_gap_count)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check -- neqsim-mcp-server/test_mcp_server.py
          git diff -- neqsim-mcp-server/test_mcp_server.py > primary-accounting.patch

      - name: Upload patched primary harness
        uses: actions/upload-artifact@v7
        with:
          name: mcp-primary-accounting-patched
          path: |
            neqsim-mcp-server/test_mcp_server.py
            primary-accounting.patch
          if-no-files-found: error
