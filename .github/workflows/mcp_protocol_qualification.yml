name: MCP protocol qualification

permissions:
  contents: read

concurrency:
  group: mcp-protocol-qualification-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - master
    paths:
      - 'pom*.xml'
      - 'src/main/java/neqsim/mcp/**'
      - 'src/test/java/neqsim/mcp/**'
      - 'neqsim-mcp-server/**'
      - '.github/workflows/mcp_protocol_qualification.yml'
  push:
    branches:
      - master
    paths:
      - 'pom*.xml'
      - 'src/main/java/neqsim/mcp/**'
      - 'src/test/java/neqsim/mcp/**'
      - 'neqsim-mcp-server/**'
      - '.github/workflows/mcp_protocol_qualification.yml'

jobs:
  phase0_contracts:
    name: Qualify focused contracts over packaged MCP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install exact NeqSim core without tests
        run: mvn -B install -DskipTests -Dmaven.javadoc.skip=true -ntp

      - name: Build exact MCP server package
        shell: bash
        run: |
          NEQSIM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          cd neqsim-mcp-server
          mvn -B package -Dneqsim.version="$NEQSIM_VERSION" -DskipTests -Dmaven.javadoc.skip=true -ntp

      - name: Run focused real-MCP API-inspection qualification
        run: cd neqsim-mcp-server && python test_inspect_api_protocol.py

      - name: Run focused real-MCP validation-profile qualification
        run: cd neqsim-mcp-server && python test_validation_profile_protocol.py
