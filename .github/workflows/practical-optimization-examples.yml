name: Practical optimization examples

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/practical-optimization-examples.yml'
      - 'docs/process/optimization/PRACTICAL_EXAMPLES.md'
      - 'devtools/test_practical_optimization_examples.py'
      - 'src/main/java/neqsim/process/util/optimizer/**'
      - 'src/main/java/neqsim/process/equipment/capacity/**'
      - 'src/main/java/neqsim/process/equipment/compressor/**'
      - 'src/test/java/neqsim/process/util/optimizer/PracticalOptimizationDocumentationTest.java'
      - 'src/test/java/neqsim/process/util/optimizer/ProcessOptimizationEngineOperatingPointTest.java'
      - 'pom.xml'

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile and execute Java documentation and regression tests
        run: >-
          ./mvnw -B -ntp
          -Dtest=ProcessOptimizationEngineOperatingPointTest,PracticalOptimizationDocumentationTest,ProcessOptimizationEngineTest,FlowRateOptimizerTest
          test dependency:build-classpath -Dmdep.outputFile=target/practical-classpath.txt
      - name: Install documented Python dependencies
        run: python -m pip install "neqsim==3.20.0" numpy pandas matplotlib
      - name: Execute Python examples against documented release
        env:
          MPLBACKEND: Agg
        run: python -m unittest devtools.test_practical_optimization_examples -v
      - name: Execute Python examples against current Java source
        env:
          MPLBACKEND: Agg
        run: |
          export NEQSIM_TEST_CLASSPATH="$PWD/target/classes:$(cat target/practical-classpath.txt)"
          python -m unittest devtools.test_practical_optimization_examples -v
