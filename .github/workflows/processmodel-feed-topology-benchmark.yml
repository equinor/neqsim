name: ProcessModel feed topology benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/processmodel-feed-topology-benchmark.yml"
      - "src/main/java/neqsim/process/processmodel/ProcessModel.java"
      - "src/test/java/neqsim/process/processmodel/ProcessModelFeedTopologyBenchmark.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep five independent runners so paired deltas can be repeated without shared JVM state.
  benchmark:
    name: benchmark fork ${{ matrix.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fork: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Prepare fixed master baseline
        run: |
          git worktree add ../neqsim-baseline 5c010191b00c2ec3cc7a09533f7f9010f4be4c82
          cp src/test/java/neqsim/process/processmodel/ProcessModelFeedTopologyBenchmark.java \
            ../neqsim-baseline/src/test/java/neqsim/process/processmodel/
      - name: Compile candidate
        run: ./mvnw -q -DskipTests test-compile
      - name: Compile baseline
        working-directory: ../neqsim-baseline
        run: ./mvnw -q -DskipTests test-compile
      - name: Run paired benchmark fork ${{ matrix.fork }}
        env:
          FORK: ${{ matrix.fork }}
        run: |
          run_case() {
            local label="$1"
            local directory="$2"
            rm -f "${directory}/target/feed-topology-benchmark.txt"
            (
              cd "${directory}"
              ./mvnw -q \
                -Dtest=ProcessModelFeedTopologyBenchmark \
                -Dneqsim.benchmark.feedTopology=true \
                test
            )
            sed "s/^/${label} /" "${directory}/target/feed-topology-benchmark.txt"
          }
          if (( FORK % 2 == 1 )); then
            run_case BASELINE ../neqsim-baseline
            run_case CANDIDATE .
          else
            run_case CANDIDATE .
            run_case BASELINE ../neqsim-baseline
          fi
