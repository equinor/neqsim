name: Synchronize component parameters for issue 4049

on:
  push:
    branches:
      - fix/4049-water-cp-placeholders
    paths:
      - .github/workflows/sync-component-parameters-4049.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: github.repository == 'equinor/neqsim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize the stored extended table
        run: |
          python3 devtools/repair_water_cp_placeholders.py --write
          python3 devtools/repair_water_cp_placeholders.py --check
          git diff --exit-code -- src/main/resources/data/COMP.csv
          if git diff --quiet -- src/main/resources/data/COMP_EXT.csv; then
            echo 'The extended table was already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/data/COMP_EXT.csv
          git commit -m 'chore(data): synchronize COMP_EXT shared component parameters'
          git push origin "HEAD:${GITHUB_REF}"
