name: Validate Integrated Energy Master

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/validate-integrated-energy-master.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Spotless check
        run: bash devtools/run_spotless.sh check
      - name: Documentation search coverage
        run: python devtools/check_documentation_search.py
      - name: Build, test, and JavaDoc
        run: ./mvnw -B test javadoc:javadoc
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install notebook runtime
        run: python -m pip install --upgrade pip nbformat nbconvert jupyter pandas matplotlib numpy jpype1
      - name: Execute and validate energy notebooks
        env:
          NEQSIM_PROJECT_ROOT: ${{ github.workspace }}
          MPLBACKEND: Agg
        shell: bash
        run: |
          set -euxo pipefail
          for notebook in examples/notebooks/energy_networks/*.ipynb; do
            python -m jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=1200 \
              --ExecutePreprocessor.kernel_name=python3 "$notebook"
          done
          python - <<'PY'
          from pathlib import Path
          import nbformat
          notebooks = sorted(Path('examples/notebooks/energy_networks').glob('*.ipynb'))
          assert len(notebooks) == 4, notebooks
          for path in notebooks:
              nb = nbformat.read(path, as_version=4)
              code = [c for c in nb.cells if c.cell_type == 'code']
              assert code and all(c.execution_count is not None for c in code), path
              errors = [o for c in code for o in c.get('outputs', []) if o.get('output_type') == 'error']
              assert not errors, (path, errors)
              figures = [o for c in code for o in c.get('outputs', []) if 'image/png' in o.get('data', {})]
              assert len(figures) >= 3, (path, len(figures))
              print(f'{path}: {len(code)} code cells, {len(figures)} figures')
          PY
