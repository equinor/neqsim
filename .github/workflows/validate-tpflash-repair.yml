name: Validate TPflash repair candidate

on: [push]

jobs:
  validate-complete-seed-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/tpflash-local-stability-current
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply complete Wilson beta rollback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/neqsim/thermodynamicoperations/flashops/TPmultiflash.java')
          s = p.read_text()
          old = 'system.setBeta(newPhaseIdx, getIncipientWilsonPhaseFraction(dominantComp));'
          count = s.count(old)
          assert count == 2, count
          s = s.replace(old, 'system.setBeta(newPhaseIdx, system.getPhase(0).getComponent(dominantComp).getz());')
          p.write_text(s)

          p = Path('src/test/java/neqsim/pvtsimulation/simulation/HydrocarbonScrubberSaturationPressureStabilityTest.java')
          s = p.read_text()
          old = '      assertEquals(1.0, compositionSum, 1.0e-9);\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '      assertEquals(1.0, compositionSum, 1.0e-12);\n'))
          PY
      - name: Format
        run: mvn -B -ntp spotless:apply
      - name: Run focused failures and serialization guard
        run: mvn -B -ntp -Djacoco.skip=true '-Dtest=TPFlashTest#testRun5,TPflashIncipientPhaseStabilityTest#subResidualTpdDoesNotOverrideExistingUmrPruSolution,EclipseFluidReadWriteTest#testFluidWater3,SystemThermoSerializationInventoryTest' test
      - name: Run TPflash control regressions
        run: mvn -B -ntp -Djacoco.skip=true '-Dtest=TPflashIncipientPhaseStabilityTest,TPFlashTest,TPmultiflashHighWaterGasSeedTest,PhaseUMRCPAvolcorTest,HydrateInhibitorFlashTest#testElectrolyteCPA' test
      - name: Run scrubber regression
        run: mvn -B -ntp -Djacoco.skip=true -DexcludedTestGroups= -Dtest=HydrocarbonScrubberSaturationPressureStabilityTest test
