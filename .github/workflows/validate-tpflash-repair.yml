name: Validate scrubber tolerance repair

on: [push]

permissions:
  contents: read

jobs:
  exact_scrubber:
    name: Exact scrubber regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 30ea45eb31582d8966790c0d831b3f422921b98a
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -ntp -Dtest=HydrocarbonScrubberSaturationPressureStabilityTest -Dgroups=slow "-DexcludedTestGroups=" "-Djacoco.skip=true"

  affected_slow_shard:
    name: Affected slow-test shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 30ea45eb31582d8966790c0d831b3f422921b98a
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Discover and run containing shard
        shell: bash
        run: |
          mapfile -t slow_files < <(grep -rl --include='*.java' '@Tag("slow")' src/test/java | sort)
          target='src/test/java/neqsim/pvtsimulation/simulation/HydrocarbonScrubberSaturationPressureStabilityTest.java'
          target_index=-1
          for index in "${!slow_files[@]}"; do
            if [[ "${slow_files[$index]}" == "$target" ]]; then
              target_index=$index
              break
            fi
          done
          if (( target_index < 0 )); then
            echo 'Target slow test not found'
            exit 1
          fi
          shard=$((target_index % 4))
          echo "Scrubber test belongs to shard $((shard + 1))/4"
          selected=()
          for index in "${!slow_files[@]}"; do
            if ((index % 4 == shard)); then
              class_name="${slow_files[$index]#src/test/java/}"
              class_name="${class_name%.java}"
              selected+=("${class_name//\//.}")
            fi
          done
          test_pattern=$(IFS=,; echo "${selected[*]}")
          mvn -B test -ntp -Dtest="$test_pattern" -Dgroups=slow "-DexcludedTestGroups=" "-Djacoco.skip=true"
