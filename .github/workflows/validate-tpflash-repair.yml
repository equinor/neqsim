name: Validate TPflash repair candidate

on: [push]

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/tpflash-repair-validation3
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply candidate repair
        run: python .github/tpflash_repair.py
      - name: Format
        run: mvn -B -ntp spotless:apply
      - name: Run focused regressions
        run: mvn -B -ntp -Djacoco.skip=true '-Dtest=TPFlashTest#testRun5,TPflashIncipientPhaseStabilityTest#subResidualTpdDoesNotOverrideExistingUmrPruSolution,EclipseFluidReadWriteTest#testFluidWater3,SystemThermoSerializationInventoryTest' test
      - name: Run scrubber regression
        run: mvn -B -ntp -Djacoco.skip=true -Dtest=HydrocarbonScrubberSaturationPressureStabilityTest test
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/tpflash-repair.trigger .github/tpflash_repair.py .github/workflows/validate-tpflash-repair.yml
          git add -A
          git commit -m 'fix(flash): reject sub-residual stability phases' || exit 0
          git push origin HEAD:fix/tpflash-repair-validation3
