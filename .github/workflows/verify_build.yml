name: Run build, test and javadoc
permissions:
  contents: read

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  changes:
    name: Detect Java/XML changes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run_tests:
              - '**/*.java'
              - '**/*.xml'
              - '.github/workflows/verify_build.yml'

  test_javadoc:
    name: Assert javadoc with Java 21 on Ubuntu
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up Java 21 environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate javadoc
        run: mvn javadoc:javadoc -ntp

  test_java_matrix:
    name: Assert tests with Java 21 on ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    needs: test_javadoc
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: Ubuntu
            os: ubuntu-latest
            verify_jacoco: true
          - platform: Windows
            os: windows-latest
            verify_jacoco: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up Java 21 environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run fast tests and generate JaCoCo report
        if: matrix.verify_jacoco
        run: mvn -B test -ntp -DskipITs
      - name: Run fast tests, do not generate JaCoCo report
        if: ${{ !matrix.verify_jacoco }}
        run: mvn -B test -ntp -DskipITs "-Djacoco.skip=true"
      - name: Verify JaCoCo report exists
        if: matrix.verify_jacoco && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            echo "JaCoCo report found"
            head -20 target/site/jacoco/jacoco.xml
          else
            echo "ERROR: JaCoCo report not found!"
            echo "Checking for jacoco.exec..."
            ls -la target/ | grep -i jacoco || echo "No jacoco files in target/"
            echo "Checking target/site/jacoco/..."
            ls -la target/site/jacoco/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
      - name: Upload jacoco coverage reports to Codecov
        if: matrix.verify_jacoco && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v7
        with:
          files: target/site/jacoco/jacoco.xml
          name: codecov
          use_oidc: true
          fail_ci_if_error: true

  test_java_slow:
    name: Assert slow tests (${{ matrix.label }}) with Java 21 on Ubuntu
    runs-on: ubuntu-latest
    needs: test_javadoc
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: 1/4
          - shard: 1
            label: 2/4
          - shard: 2
            label: 3/4
          - shard: 3
            label: 4/4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up Java 21 environment
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run slow-test shard without JaCoCo
        shell: bash
        run: |
          mapfile -t slow_files < <(
            grep -rl --include='*.java' '@Tag("slow")' src/test/java | sort
          )
          selected=()
          for index in "${!slow_files[@]}"; do
            if ((index % 4 == ${{ matrix.shard }})); then
              class_name="${slow_files[$index]#src/test/java/}"
              class_name="${class_name%.java}"
              selected+=("${class_name//\//.}")
            fi
          done
          if ((${#selected[@]} == 0)); then
            echo "No slow tests discovered for shard ${{ matrix.shard }}"
            exit 1
          fi
          test_pattern=$(IFS=,; echo "${selected[*]}")
          mvn -B test -ntp -Dtest="$test_pattern" -Dgroups=slow \
            "-DexcludedTestGroups=" "-Djacoco.skip=true"

  test_java_8:
    name: Assert tests with Java 8 on Ubuntu
    runs-on: ubuntu-latest
    needs: test_java_matrix
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Run tests
        run: mvn -B test --file pomJava8.xml -ntp "-Djacoco.skip=true"

  test_java_8_windows:
    name: Assert tests with Java 8 on Windows
    runs-on: windows-latest
    needs: test_java_matrix
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Run tests
        run: mvn -B test --file pomJava8.xml -ntp "-Djacoco.skip=true"

  verify_agent_skills:
    name: Verify agent-skill cross-references
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check agent-skill references
        run: python devtools/verify_agent_skill_refs.py
