# SYNTHETIC demonstration cases for the two-template tie-back (see route.yaml and basis.yaml). Not a real field.
# Rate basis: hydrocarbon wellstream (dry) and produced/condensed water are MASS rates; MEG is a lean stream of the stated
# purity (mass %). Pressure boundary: absolute host-interface pressure (bara). Source pressures are CALCULATED (backward solve).
schema: flow_assurance_cases.v1
topology_variants:
  - {id: DEFAULT, description: "Both templates producing to the host through the gathering PLEM"}
  - id: B-ISOLATED
    description: "Template B isolated at XV-B; template A produces alone through the unchanged trunk and riser"
    isolate_sources: [TMPL-B]
cases:
  - id: BASE
    label: "Base - plateau, early life"
    role: design
    stage: plateau
    topology_variant: DEFAULT
    fluid: WELLSTREAM-1
    description: "Plateau rates, low water production, MEG injected at both templates"
    sources:
      TMPL-A: {hc_rate: {value: 22.0, unit: kg/s, basis: mass}, water_rate: {value: 3000.0, unit: kg/h, basis: mass}, t_c: 85.0,
               inhibitor_rate: {value: 1500.0, unit: kg/h, basis: mass}}
      TMPL-B: {hc_rate: {value: 15.0, unit: kg/s, basis: mass}, water_rate: {value: 2000.0, unit: kg/h, basis: mass}, t_c: 83.0,
               inhibitor_rate: {value: 1000.0, unit: kg/h, basis: mass}}
    inhibitor: {name: MEG, purity_wt: 0.90, basis: "lean MEG stream, mass fraction MEG; no losses to gas or condensate"}
    boundary: {outlet: {node: HOST-IN, type: pressure, value: {value: 70.0, unit: bara}, reference: "host inlet, riser top battery limit"},
               inlet: {type: rate_specified, note: "source pressures are solved"}}
    shut_in: {settle_out_pressure_bara: 125.0, ambient_note: "seabed ambient per route; inhibitor retained in place", duration_h: 72.0}
  - id: TURNDOWN
    label: "Turndown - minimum stable rate"
    role: scenario
    stage: turndown
    topology_variant: DEFAULT
    fluid: WELLSTREAM-1
    description: "35 % of plateau hydrocarbon rate and water rate; MEG scaled with water so the aqueous concentration is unchanged"
    sources:
      TMPL-A: {hc_rate: {value: 8.0, unit: kg/s, basis: mass}, water_rate: {value: 1200.0, unit: kg/h, basis: mass}, t_c: 85.0,
               inhibitor_rate: {value: 600.0, unit: kg/h, basis: mass}}
      TMPL-B: {hc_rate: {value: 5.5, unit: kg/s, basis: mass}, water_rate: {value: 800.0, unit: kg/h, basis: mass}, t_c: 83.0,
               inhibitor_rate: {value: 400.0, unit: kg/h, basis: mass}}
    inhibitor: {name: MEG, purity_wt: 0.90, basis: "lean MEG stream, mass fraction MEG; no losses to gas or condensate"}
    boundary: {outlet: {node: HOST-IN, type: pressure, value: {value: 70.0, unit: bara}, reference: "host inlet, riser top battery limit"},
               inlet: {type: rate_specified, note: "source pressures are solved"}}
    shut_in: {settle_out_pressure_bara: 125.0, ambient_note: "seabed ambient per route; inhibitor retained in place", duration_h: 72.0}
  - id: LATE
    label: "Late life - high water, declining rate"
    role: scenario
    stage: late_life
    topology_variant: DEFAULT
    fluid: WELLSTREAM-1
    description: "55 % of plateau hydrocarbon rate, six times the plateau water rate, lower wellhead temperature and lower host inlet pressure; MEG dose NOT increased (baseline for the mitigation cases)"
    sources:
      TMPL-A: {hc_rate: {value: 12.0, unit: kg/s, basis: mass}, water_rate: {value: 18000.0, unit: kg/h, basis: mass}, t_c: 75.0,
               inhibitor_rate: {value: 1500.0, unit: kg/h, basis: mass}}
      TMPL-B: {hc_rate: {value: 8.2, unit: kg/s, basis: mass}, water_rate: {value: 12000.0, unit: kg/h, basis: mass}, t_c: 74.0,
               inhibitor_rate: {value: 1000.0, unit: kg/h, basis: mass}}
    inhibitor: {name: MEG, purity_wt: 0.90, basis: "lean MEG stream, mass fraction MEG; no losses to gas or condensate"}
    boundary: {outlet: {node: HOST-IN, type: pressure, value: {value: 65.0, unit: bara}, reference: "host inlet, riser top battery limit"},
               inlet: {type: rate_specified, note: "source pressures are solved"}}
    shut_in: {settle_out_pressure_bara: 115.0, ambient_note: "seabed ambient per route; inhibitor retained in place", duration_h: 72.0}
  - id: LATE-M1
    label: "Late life - MEG dose raised to 30 wt % aqueous"
    role: mitigation
    stage: late_life
    topology_variant: DEFAULT
    baseline_case: LATE
    fluid: WELLSTREAM-1
    description: "As LATE with the lean MEG rate per template computed for a 30 wt % MEG mass fraction in the aqueous phase"
    sources:
      TMPL-A: {hc_rate: {value: 12.0, unit: kg/s, basis: mass}, water_rate: {value: 18000.0, unit: kg/h, basis: mass}, t_c: 75.0, inhibitor_target_wt: 0.30}
      TMPL-B: {hc_rate: {value: 8.2, unit: kg/s, basis: mass}, water_rate: {value: 12000.0, unit: kg/h, basis: mass}, t_c: 74.0, inhibitor_target_wt: 0.30}
    inhibitor: {name: MEG, purity_wt: 0.90, basis: "lean MEG stream, mass fraction MEG; no losses to gas or condensate"}
    boundary: {outlet: {node: HOST-IN, type: pressure, value: {value: 65.0, unit: bara}, reference: "host inlet, riser top battery limit"},
               inlet: {type: rate_specified, note: "source pressures are solved"}}
    shut_in: {settle_out_pressure_bara: 115.0, ambient_note: "seabed ambient per route; inhibitor retained in place", duration_h: 72.0}
  - id: LATE-M2
    label: "Late life - trunk insulation +30 mm, baseline MEG dose"
    role: mitigation
    stage: late_life
    topology_variant: DEFAULT
    baseline_case: LATE
    fluid: WELLSTREAM-1
    description: "As LATE with the PP insulation of the four trunk segments increased from 60 mm to 90 mm"
    layer_overrides:
      FL-T-01: {"PP insulation": 0.090}
      FL-T-02: {"PP insulation": 0.090}
      FL-T-03: {"PP insulation": 0.090}
      FL-T-04: {"PP insulation": 0.090}
    sources:
      TMPL-A: {hc_rate: {value: 12.0, unit: kg/s, basis: mass}, water_rate: {value: 18000.0, unit: kg/h, basis: mass}, t_c: 75.0,
               inhibitor_rate: {value: 1500.0, unit: kg/h, basis: mass}}
      TMPL-B: {hc_rate: {value: 8.2, unit: kg/s, basis: mass}, water_rate: {value: 12000.0, unit: kg/h, basis: mass}, t_c: 74.0,
               inhibitor_rate: {value: 1000.0, unit: kg/h, basis: mass}}
    inhibitor: {name: MEG, purity_wt: 0.90, basis: "lean MEG stream, mass fraction MEG; no losses to gas or condensate"}
    boundary: {outlet: {node: HOST-IN, type: pressure, value: {value: 65.0, unit: bara}, reference: "host inlet, riser top battery limit"},
               inlet: {type: rate_specified, note: "source pressures are solved"}}
    shut_in: {settle_out_pressure_bara: 115.0, ambient_note: "seabed ambient per route; inhibitor retained in place", duration_h: 72.0}
  - id: LATE-M3
    label: "Late life - MEG 30 wt % and branch insulation 80 mm"
    role: mitigation
    stage: late_life
    topology_variant: DEFAULT
    baseline_case: LATE
    fluid: WELLSTREAM-1
    description: "Combination: lean MEG rate for a 30 wt % aqueous mass fraction and the PP insulation of the five branch flowline segments increased from 40 mm to 80 mm"
    layer_overrides:
      FL-A-01: {"PP insulation": 0.080}
      FL-A-02: {"PP insulation": 0.080}
      FL-A-03: {"PP insulation": 0.080}
      FL-B-01: {"PP insulation": 0.080}
      FL-B-02: {"PP insulation": 0.080}
    sources:
      TMPL-A: {hc_rate: {value: 12.0, unit: kg/s, basis: mass}, water_rate: {value: 18000.0, unit: kg/h, basis: mass}, t_c: 75.0, inhibitor_target_wt: 0.30}
      TMPL-B: {hc_rate: {value: 8.2, unit: kg/s, basis: mass}, water_rate: {value: 12000.0, unit: kg/h, basis: mass}, t_c: 74.0, inhibitor_target_wt: 0.30}
    inhibitor: {name: MEG, purity_wt: 0.90, basis: "lean MEG stream, mass fraction MEG; no losses to gas or condensate"}
    boundary: {outlet: {node: HOST-IN, type: pressure, value: {value: 65.0, unit: bara}, reference: "host inlet, riser top battery limit"},
               inlet: {type: rate_specified, note: "source pressures are solved"}}
    shut_in: {settle_out_pressure_bara: 115.0, ambient_note: "seabed ambient per route; inhibitor retained in place", duration_h: 72.0}
  - id: TURN-M4
    label: "Turndown - MEG dose raised to 40 wt % aqueous"
    role: mitigation
    stage: turndown
    topology_variant: DEFAULT
    baseline_case: TURNDOWN
    fluid: WELLSTREAM-1
    description: "As TURNDOWN with the lean MEG rate per template computed for a 40 wt % MEG mass fraction in the aqueous phase"
    sources:
      TMPL-A: {hc_rate: {value: 8.0, unit: kg/s, basis: mass}, water_rate: {value: 1200.0, unit: kg/h, basis: mass}, t_c: 85.0, inhibitor_target_wt: 0.40}
      TMPL-B: {hc_rate: {value: 5.5, unit: kg/s, basis: mass}, water_rate: {value: 800.0, unit: kg/h, basis: mass}, t_c: 83.0, inhibitor_target_wt: 0.40}
    inhibitor: {name: MEG, purity_wt: 0.90, basis: "lean MEG stream, mass fraction MEG; no losses to gas or condensate"}
    boundary: {outlet: {node: HOST-IN, type: pressure, value: {value: 70.0, unit: bara}, reference: "host inlet, riser top battery limit"},
               inlet: {type: rate_specified, note: "source pressures are solved"}}
    shut_in: {settle_out_pressure_bara: 125.0, ambient_note: "seabed ambient per route; inhibitor retained in place", duration_h: 72.0}
  - id: ALT-B-ISOLATED
    label: "Alternate line-up - template B isolated"
    role: scenario
    stage: plateau
    topology_variant: B-ISOLATED
    fluid: WELLSTREAM-1
    description: "Template B closed in at XV-B; template A alone at its plateau rate; trunk and riser unchanged"
    sources:
      TMPL-A: {hc_rate: {value: 22.0, unit: kg/s, basis: mass}, water_rate: {value: 3000.0, unit: kg/h, basis: mass}, t_c: 85.0,
               inhibitor_rate: {value: 1500.0, unit: kg/h, basis: mass}}
    inhibitor: {name: MEG, purity_wt: 0.90, basis: "lean MEG stream, mass fraction MEG; no losses to gas or condensate"}
    boundary: {outlet: {node: HOST-IN, type: pressure, value: {value: 70.0, unit: bara}, reference: "host inlet, riser top battery limit"},
               inlet: {type: rate_specified, note: "source pressures are solved"}}
    shut_in: {settle_out_pressure_bara: 125.0, ambient_note: "seabed ambient per route; inhibitor retained in place", duration_h: 72.0}
events:
  - {id: EVT-SHUTIN-01, case: BASE, type: shut_in, analysis: lumped_cooldown, time_origin: "t = 0 at simultaneous closure of the tree valves and the host inlet valve",
     description: "Unplanned shut-in from base operation; time to reach the hydrate equilibrium temperature at the settle-out pressure"}
  - {id: EVT-SHUTIN-02, case: TURNDOWN, type: shut_in, analysis: lumped_cooldown, time_origin: "t = 0 at simultaneous closure of the tree valves and the host inlet valve",
     description: "Shut-in from turndown operation"}
  - {id: EVT-SHUTIN-03, case: LATE, type: shut_in, analysis: lumped_cooldown, time_origin: "t = 0 at simultaneous closure of the tree valves and the host inlet valve",
     description: "Shut-in from late-life operation at the baseline MEG dose"}
  - id: EVT-RESTART-01
    case: LATE
    type: restart
    analysis: external
    description: "Restart after 48 h shut-in with depressurisation, warm-up and liquid sweep-out through the riser"
    required_outputs: ["riser-top liquid rate versus time", "host inlet pressure versus time", "peak liquid slug volume at the host inlet", "minimum temperature margin to hydrate during warm-up"]
    comparison_criteria: "peak slug volume within the host slug-catcher allowance supplied by the host (not supplied in this demonstration)"
  - id: EVT-PIG-01
    case: BASE
    type: pigging
    analysis: external
    description: "Pig run from the pig launcher interface at PLEM-1 to the host pig receiver"
    required_outputs: ["pig velocity profile", "liquid slug ahead of the pig at arrival", "host inlet pressure disturbance"]
    comparison_criteria: "arrival slug volume and rate within the host receiving limits (not supplied in this demonstration)"
