assumptions:
- SYNTHETIC-BASIS-001 is an educational input basis, not a project design basis or
  standard.
- All package dimensions, envelopes, operating masses, deck limits and two-metre corridor
  widths are synthetic assumptions.
- Orthogonal rectangular packages and level rectangular decks are the supported screening
  geometry.
- Connection distances are geometric proxies; no detailed piping, hydraulic, stress
  or cable design has been performed.
- Catalogue editions are candidate metadata; adoption and full-text clause applicability
  require project review.
data_gaps:
- Vendor dimensions, nozzles, auxiliaries and operation/inspection/replacement/lifting
  requirements are not verified.
- No qualified hazardous-area, fire, explosion, toxic dispersion or evacuation exposure/capacity
  evidence.
- No terrain/flood/drainage, structural, construction or marine qualification.
options:
  alternatives: 3
  grid_m: 1.0
  max_candidates: 100000
  backend: deterministic
