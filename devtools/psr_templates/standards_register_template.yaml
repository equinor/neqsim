# Standards register template for process-study reports.
# Editions and status below were checked on 2026-10-20 (see references/standards_verification.md).
# RE-VERIFY before issuing a report: editions and status change. Keep one row per standard actually applied.
# requirement_class: mandatory (project/company/regulatory requirement) | recommended (good practice) | informative.
# text_available: true only if the licensed text was actually read for this study. If false, compliance must
# not be claimed beyond what is evidenced (the validator rejects an unqualified 'complies' statement).
standards:
