    edition: "2014"
    status: "Current per accredited reseller listing; iso.org catalogue page not retrievable (JavaScript catalogue)"
    source_url: "https://www.en-standard.eu/iso-10628-1-2014-diagrams-for-the-chemical-and-petrochemical-industry-part-1-specification-of-diagrams/"
    date_checked: "2026-10-20"
    application: "Content, classification and drafting conventions of block flow diagrams and PFDs (stream numbering, equipment tags, legend, title block)"
    requirement_class: "recommended"
    text_available: false
    compliance_statement: "Conventions applied as publicly described in the abstract; conformance with the standard text is not claimed because the text was not available"
    deviations: "Drawings are generated schematically; no formal conformance review performed"
  - reference: "ISO 10628-2"
