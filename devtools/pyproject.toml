[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neqsim-dev-setup"
version = "0.2.0"
description = "NeqSim task-solving toolkit: JVM bootstrap, task folders, runner, validators, report generator"
requires-python = ">=3.11,<3.15"
# `neqsim` supplies the packaged JAR that neqsim_dev_setup falls back to when
# no source checkout is present (agent-plugin installs).
dependencies = [
    "jpype1",
    "pyyaml>=5.1",
    "neqsim>=3.18",
    "python-docx>=1.1",
    "matplotlib>=3.7",
    # Enforce the security floor for pip installs as well as the uv lockfile.
    "pillow>=13.0.0",
]

[dependency-groups]
test = ["pytest", "scikit-learn", "trimesh", "jsonschema==4.26.0"]
install-smoke = ["pip"]
optimization-docs = ["numpy", "scipy", "pandas", "matplotlib", "nlopt"]
optimization-notebooks = [
    { include-group = "optimization-docs" },
    "nbformat",
    "nbclient",
    "nbconvert",
    "ipykernel",
]

[project.optional-dependencies]
combustion = ["cantera==3.2.0"]
pdf = ["pymupdf>=1.22.0", "reportlab>=4.0"]
ocr = [
    "pymupdf>=1.22.0",
    "ocrmypdf>=15.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
]

[project.scripts]
neqsim = "neqsim_cli:main"

[tool.setuptools]
# Flat modules keep the repo layout (devtools/*.py) identical to the installed
# layout (site-packages/*.py), so SCRIPT_DIR-relative lookups such as
# new_task -> task_template/ work in both.
py-modules = [
    "neqsim_dev_setup", "neqsim_cli", "docker_runtime", "install_skill", "install_agent",
    "new_task", "task_roots", "task_corpus", "generate_work_record",
    "validate_task_results", "consistency_checker", "generate_sources_md",
    "pdf_to_figures", "skill_search", "agent_search", "agent_frontmatter", "bm25",
    "discovery_registry",
    "ensure_on_path", "paperlab_install", "new_skill", "neqsim_doctor", "onboard",
    "neqsim_try", "neqsim_contribute", "java_locator", "doc_retriever", "stid_download",
    "process_study_report", "psr_extract", "psr_balances", "psr_basis", "psr_diagrams", "psr_report", "psr_validate", "psr_demo",
    "process_report", "psr_draft",
    "fa_units", "fa_geometry", "fa_thermal", "fa_methods", "fa_solver", "fa_benchmarks", "fa_study", "fa_draw",
    "fa_sheets_net", "fa_sheets_results", "fa_diagrams", "fa_handoff", "fa_report", "fa_validate", "flow_assurance_report",
    "pvt_data", "pvt_study", "pvt_report",
    "surf_spec", "surf_model", "surf_run", "surf_design", "surf_quantities", "surf_dataset", "surf_draw", "surf_sheets_a", "surf_sheets_b", "surf_diagrams",
    "surf_report", "surf_validate", "surf_study",
    "layout_model", "layout_engine", "layout_process", "layout_examples", "layout_study",
    "layout_drawings", "layout_cad", "layout_report",
]
packages = [
    "neqsim_runner",
    "neqsim_continuous",
    "task_template",
    "task_template.step1_scope_and_research",
    "task_template.step2_analysis",
    "task_template.step3_report",
    "psr_templates",
    "fa_templates",
    "fa_examples",
    "fa_examples.offshore_tieback",
    "fa_examples.single_flowline",
    "pvt_examples",
    "surf_templates",
    "surf_examples",
    "surf_examples.four_well_tieback",
    "layout_templates",
    "layout_example_specs",
]

[tool.setuptools.package-data]
task_template = ["*", "*/*", "*/*/*", "*/*/*/*"]
psr_templates = ["*.yaml"]
fa_templates = ["*.yaml", "*.md"]
surf_templates = ["*.yaml", "*.md"]
"surf_examples.four_well_tieback" = ["*.yaml"]
"fa_examples.offshore_tieback" = ["*.yaml"]
"fa_examples.single_flowline" = ["*.yaml"]
pvt_examples = ["*.yaml", "*.json"]
layout_templates = ["*.json"]
layout_example_specs = ["*.yaml"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
