  - {id: CR-DP, description: "Maximum operating pressure on each line does not exceed its design pressure", quantity: pressure_to_design_ratio_max, operator: "<=", value: 1.0, unit: "-", source: SYN-1}
  - {id: CR-HYD, description: "Minimum hydrate equilibrium margin (uninhibited) on the production system", quantity: hydrate_margin_min_k, operator: ">=", value: 3.0, unit: dK, source: SYN-1}
  - {id: CR-EROS, description: "Erosional velocity ratio v_mix / v_erosional (C-factor from the basis)", quantity: erosional_ratio_max, operator: "<=", value: 1.0, unit: "-", source: SYN-1}
  - {id: CR-ARRT, description: "Host arrival temperature", quantity: host_arrival_temperature_c, operator: ">=", value: 20.0, unit: C, source: SYN-1}
  - {id: CR-HOST, description: "Host inlet mass rate does not exceed the host limit", quantity: host_inlet_rate_kg_s, operator: "<=", value: 60.0, unit: kg/s, source: SYN-1}
  - {id: CR-FRAC, description: "Injection pressure margin below the fracture limit", quantity: injection_fracture_margin_bar, operator: ">=", value: 10.0, unit: bar, source: SYN-1}
  - {id: CR-UMB, description: "Chemical delivery pressure margin above the production pressure at the injection point", quantity: umbilical_margin_bar, operator: ">=", value: 20.0, unit: bar, source: SYN-1}
  - {id: CR-COOL, description: "Lumped cooldown time to the hydrate temperature on the trunk line", quantity: cooldown_time_h, operator: ">=", value: 8.0, unit: h, source: SYN-1}

solver:
  network_tolerance_pa: 100.0
  max_iterations: 100
  coupling_relaxation: 0.7
  coupling_max_iterations: 60
  coupling_rate_tolerance_kg_s: 0.001
  coupling_pressure_tolerance_bar: 0.01
  erosional_c_factor_si: 122.0
  erosional_c_source: SYN-1
  hydrate_grid_bara: [20.0, 40.0, 70.0, 110.0, 160.0, 220.0]
  hydrate_water_mole_fraction: 0.05
  mesh_sensitivity: {factor: 2, tolerances: {p_bar: 1.0, t_k: 3.0}}
  cost: {region: NORWAY, price_year_note: "as stated by the SURFCostEstimator basis", contingency_note: "estimator-internal; no separate contingency added"}

assumptions:
  - "All inputs are synthetic and invented for demonstration; they are not field, vendor or standard data."
  - "Producer boundaries are live NeqSim WellFlow productivity-index inflow at the tree; the tubing VLP is not modelled."
  - "Injection wells use the explicit liquid mass-injectivity contract (kg/s per bar); water is pure SRK water."
  - "Riser shapes are concept schematics; their equilibrium geometry and dynamics are not analysed."
  - "Chemical tubes are single-phase Darcy-Weisbach lines; umbilical mechanical design and electrical analysis are not assessed."
  - "Beggs and Brill temperature results change by about 2 K between 8 and 16 increments on the long trunk; the 3 K mesh tolerance is a synthetic project choice (the smallest temperature margin to a criterion is tens of kelvin)."
data_gaps:
  - "No surveyed bathymetry, geotechnical data or metocean data: the seabed is synthetic."
  - "No PVT study, tubing performance, reservoir model or well test: fluids and wells are synthetic."
  - "No supplier data for flexible risers, umbilicals, trees, manifolds or jumpers."
  - "No installation vessel, lay-tension, lifting or marine-warranty analysis."
  - "On-bottom stability, free span, global buckling and pipe-soil checks lack environmental and soil inputs."
exclusions:
  - "Host topside modifications beyond the inlet pressure and rate constraint."
  - "Wells (drilling and completion), subsurface and reservoir development."
  - "Detailed electrical, control-system and safety-instrumented design."
