# Synthetic public example: four production wells on two templates, two water-injection wells, a terrain-profiled flowline,
# a riser and a host inlet constraint. Every value is SYNTHETIC (invented for this example); nothing here is field, vendor
# or standard data. Units are in the key suffix; pressures are absolute (bara); z is elevation above mean sea level (m, up).
schema: surf_study.v1

document:
  title: "Four-well subsea tie-back with water injection: SURF design study (synthetic example)"
  subtitle: "Concept-stage screening package generated from one study specification"
  document_number: SURF-SYN-001
  revision: "01"
  issue_status: "Issued for review (diagnostic, synthetic example)"
  readiness: SCREENING
  date: "2026-10-25"
  company: "NeqSim open example"
  project: "Synthetic SURF demonstration"
  prepared_by: "surf-study toolkit"
  checked_by: "not assigned"
  approved_by: "not assigned"
  revision_history:
    - {rev: "01", date: "2026-10-25", description: "First generated issue from surf_study.v1", by: "surf-study toolkit"}

study:
  id: SURF-SYN
  objective: "Select between a daisy-chained and a dual-direct gathering concept for two four-well templates, and show that the generated NeqSim model, drawings, datasheets, quantities and report agree."
  maturity: concept
  design_life_years: 25
  region: "Synthetic offshore field, 350 to 415 m water depth"
  water_depth_m: 400.0
  synthetic: true
  adopted_requirements: [ISO-13628-1, API-17A, DNV-ST-F101, DNV-ST-F201, DNV-RP-O101, ISO-10628-1, ISO-7200, ISO-5457, ISO-129-1]
  decisions:
    - "Which gathering concept (A daisy-chain or B dual direct flowlines) is feasible in every operating case, and what does the feasible one cost?"
    - "Does the injection and chemical-distribution system deliver the required pressure to every consumer in every case?"
    - "Which design checks are screened here and which are open specialist hand-offs?"

conventions:
  pressure: "absolute (bara)"
  temperature: "degC"
  elevation: "metres above mean sea level, positive up; seabed is negative"
  length: "physical 3D route length in metres; installed length = route length x (1 + allowance)"
  hydraulic_diameter: "inside diameter = OD - 2 x nominal wall (corrosion allowance reported separately)"
  flow_sign: "edge rate is positive from the 'from' node to the 'to' node"

sources:
