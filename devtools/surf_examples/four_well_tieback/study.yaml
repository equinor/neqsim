concepts:
  - id: A
    label: "Concept A - daisy chain"
    description: "Template 2 flows to template 1 through a short infield flowline; one shared trunk line carries all four wells to the host."
    feasibility_note: "Shared trunk: one line to install and maintain, but the T2 wells commingle through T1."
  - id: B
    label: "Concept B - dual direct flowlines"
    description: "Template 2 has its own direct flowline to the PLEM; template 1 uses the trunk. Two long lines share the riser base."
    feasibility_note: "Independent paths for each template; about 13 km of additional flowline."
  - id: C
    label: "Concept C - daisy chain with an 8-inch trunk"
    description: "As concept A but the trunk is 219.1 x 12.7 mm instead of 323.9 x 15.9 mm: a cheaper line that is checked for feasibility before it can be ranked."
    feasibility_note: "Smaller trunk: higher mixture velocity at plateau."
    edge_overrides:
      FL-TRUNK: {od_mm: 219.1, wall_mm: 12.7}

cases:
  - {id: BASE, label: "Plateau, base case", role: design, stage: plateau, production_fluid: prod_early, host_pressure_bara: 40.0, production_reservoir_pressure_bara: 300.0, productivity_scale: 1.0, injection_pump_discharge_bara: 220.0, injection_reservoir_pressure_bara: 160.0}
  - {id: TURNDOWN, label: "Turndown (back-pressured host, reduced productivity)", role: scenario, stage: turndown, production_fluid: prod_early, host_pressure_bara: 60.0, production_reservoir_pressure_bara: 300.0, productivity_scale: 0.5, injection_pump_discharge_bara: 200.0, injection_reservoir_pressure_bara: 160.0}
  - {id: LATE, label: "Late life, high water cut", role: scenario, stage: late_life, production_fluid: prod_late, host_pressure_bara: 35.0, production_reservoir_pressure_bara: 190.0, productivity_scale: 0.8, injection_pump_discharge_bara: 230.0, injection_reservoir_pressure_bara: 190.0}

